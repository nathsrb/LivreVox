name: One-time Auralis final sections test
on:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test four real summary API calls against preview using synthetic text
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, urllib.error
          url="https://deploy-preview-2--auralis-slnr.netlify.app/api/chapters/summary"
          notes = [
              "La méthode de construction dramatique repose sur la prémisse et le désir du héros. "
              "D'abord l'auteur propose de définir la prise de conscience finale, puis d'identifier les faiblesses initiales, "
              "la faille morale et la motivation concrète. Une opposition efficace doit viser cette faille. "
              "Le principe directeur oriente les actions et assure l'unité de l'histoire. "
              "On doit comparer chaque scène au désir central, éviter les détours sans conséquence et construire "
              "une progression causale. La structure en trois actes ne décrit pas assez précisément le milieu du récit. "
              "Une méthode détaillée aide à ordonner les découvertes, les obstacles, les fausses victoires et les retournements. "
              "L'univers reflète les fragilités du héros et les révèle sous pression. "
              "Dans un récit cohérent, le spectre du passé est révélé progressivement, non expliqué dès la première page. ",
              "La suite étudie l'événement déclencheur, le développement du désir et les adversaires. "
              "L'auteur conseille de choisir un objectif concret, puis de lui faire gagner en intensité au fil des scènes. "
              "Chaque adversaire possède un désir propre et attaque une faiblesse du héros. "
              "Le faux allié crée des tensions supplémentaires sans remplacer le conflit principal. "
              "Pour structurer les scènes, partir de l'issue finale puis remonter vers les choix initiaux. "
              "Vérifier les conséquences de chaque action et les liens entre l'intrigue principale et les intrigues secondaires. "
              "Les secondaires doivent éclairer le débat moral plutôt que disperser l'attention. "
              "La révélation des intentions des adversaires doit être progressive, selon la technique de l'iceberg. "
              "Une bonne intrigue est organique : elle paraît issue des décisions des personnages et non imposée de l'extérieur. "
          ]
          cases={
              "essentials": "### L'essentiel en quelques lignes",
              "understanding": "### Comprendre le chapitre",
              "takeaways": "### Ce qu'il faut retenir",
              "application": "### Passer à la pratique",
          }
          failed=[]
          for mode,title in cases.items():
              payload={"provider":"deepinfra","bookTitle":"Guide de scénario (test synthétique)",
                       "chapterTitle":"Construire l'intrigue","summaryParts":notes,"summaryMode":mode}
              request=urllib.request.Request(url,method="POST",data=json.dumps(payload).encode(),
                                             headers={"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(request,timeout=58) as response:
                      status=response.status
                      data=json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  status=error.code
                  data=json.loads(error.read().decode())
              except Exception as error:
                  print(mode,"transport",type(error).__name__)
                  failed.append(mode)
                  continue
              content=data.get("summary","")
              print(mode,"HTTP",status,"chars",len(content),"expected heading",title in content)
              if status!=200 or title not in content or len(content)<90:
                  print("ERROR",str(data.get("error","invalid section"))[:250])
                  failed.append(mode)
          if failed:
              print("FAILED:",",".join(failed))
              sys.exit(1)
          print("ALL FOUR SECTIONS PASSED")
          
          PY
