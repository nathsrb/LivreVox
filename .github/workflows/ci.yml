name: LivreVox CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install one-off IndexedDB simulation dependencies
        run: npm install --no-save tsx fake-indexeddb
      - name: Verify huge multi-part WAV plus cache resume (no paid audio calls)
        run: npx tsx .github/auralis-large-wav-offline-smoke.mts
