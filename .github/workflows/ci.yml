name: LivreVox CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Live Kokoro audio test (preview only, tiny synthetic text)
        env:
          AURALIS_PREVIEW: https://deploy-preview-2--auralis-slnr.netlify.app
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, time
          base=os.environ["AURALIS_PREVIEW"].rstrip("/")
          routes=["openai","inference"]
          passing=[]
          for route in routes:
              body={"text":"Bonjour, je suis une voix française pour Auralis.",
                    "voice":"ff_siwis","provider":"deepinfra","ttsRoute":route}
              request=urllib.request.Request(base+"/api/tts",data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              started=time.monotonic()
              try:
                  with urllib.request.urlopen(request,timeout=45) as response:
                      status=response.status
                      mime=response.headers.get("content-type","")
                      data=response.read()
                      detail=""
              except urllib.error.HTTPError as e:
                  status=e.code
                  mime=e.headers.get("content-type","")
                  detail=e.read(500).decode("utf-8",errors="replace")
                  data=b""
              except Exception as e:
                  status=0
                  mime=""
                  detail=type(e).__name__
                  data=b""
              is_wav=status==200 and data[:4]==b"RIFF" and len(data)>44
              print(f"KOKORO_ROUTE={route} STATUS={status} WAV={is_wav} BYTES={len(data)} SECONDS={time.monotonic()-started:.1f}")
              if not is_wav:
                  print("DETAIL",detail[:250])
              else:
                  passing.append(route)
          if not passing:
              raise SystemExit("FAILED: neither Kokoro route generated valid audio")
          print("PASSED: REAL AUDIBLE WAV GENERATED USING",passing)
          # A short working sample is not enough: simulate six 700-char
          # passages with the same two-worker concurrency as the application.
          from concurrent.futures import ThreadPoolExecutor, as_completed
          phrase=("Le personnage traverse la ville et observe les détails de son histoire. "
                  "Il comprend progressivement la raison de son voyage et reprend confiance. ")
          def render_part(i):
              text=(f"Passage numéro {i}. " + phrase * 8)[:710]
              body={"text":text,"voice":"ff_siwis","provider":"deepinfra","ttsRoute":passing[0]}
              req=urllib.request.Request(base+"/api/tts",data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type":"application/json"},method="POST")
              started=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=45) as resp:
                      audio=resp.read()
                      return i, resp.status, audio[:4]==b"RIFF" and len(audio)>4400, len(audio), round(time.monotonic()-started,1)
              except urllib.error.HTTPError as error:
                  return i, error.code, False, 0, round(time.monotonic()-started,1)
              except Exception:
                  return i, 0, False, 0, round(time.monotonic()-started,1)
          with ThreadPoolExecutor(max_workers=2) as pool:
              outcomes=list(pool.map(render_part, range(1,7)))
          for result in outcomes: print("LONG_CHUNK_TEST:",result)
          if not all(item[2] for item in outcomes):
              raise SystemExit("FAILED: at least one of six 710-char audio passages failed")
          print("PASSED: SIX MEDIUM-LENGTH AUDIO CHUNKS, TWO WORKERS")
          PY

      - name: Install one-off browser storage test dependencies
        run: npm install --no-save tsx fake-indexeddb
      - name: Live full chapter audio engine + resume test (preview only)
        run: npx tsx .github/auralis-preview-audio-smoke.mts
