name: Auralis preview summary smoke
on:
  push:
    branches:
      - fix/auralis-api-chapter-detection
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify long and structured chapter summaries on preview
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.request
          import urllib.error

          url = "https://deploy-preview-2--auralis-slnr.netlify.app/api/chapters/summary"
          # Synthetic material only. No user content or API credentials are sent.
          items = [
              f"Étape {i}: définir un enjeu {i}, observer une faiblesse distincte du personnage, "
              f"choisir une action cohérente et mesurer ses conséquences pour le scénario. "
              f"Réévaluer cette action au regard des intentions de l'adversaire. "
              for i in range(1, 62)
          ]
          long_text = "\\n\\n".join(items)
          notes = [
              "L'auteur explique les objectifs du héros, le désir et le besoin moral. "
              "Il demande d'identifier le conflit, l'adversaire et les décisions, puis de les lier par cause et effet.",
              "La méthode consiste à choisir une prémisse, partir de la prise de conscience finale et remonter aux choix initiaux. "
              "Il faut construire une liste de scènes et vérifier la cohérence de leurs conséquences."
          ]
          cases = [
              ("notes-long", {"chapterText": long_text, "summaryMode": "notes"}),
              ("overview", {"chapterText": "", "summaryParts": notes, "summaryMode": "overview"}),
              ("actions", {"chapterText": "", "summaryParts": notes, "summaryMode": "actions"}),
          ]
          for name, patch in cases:
              body = {
                  "provider": "deepinfra",
                  "bookTitle": "Exemple d'un manuel de scénario",
                  "chapterTitle": "Construire une intrigue",
                  **patch,
              }
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"}, method="POST")
              status = 0
              try:
                  with urllib.request.urlopen(req, timeout=65) as response:
                      status = response.status
                      data = json.loads(response.read().decode())
              except urllib.error.HTTPError as error:
                  status = error.code
                  data = json.loads(error.read().decode())
              except Exception as error:
                  print(name, "transport failure", type(error).__name__)
                  sys.exit(1)
              result = str(data.get("summary") or "")
              print(name, "HTTP", status, "chars", len(result))
              if status != 200 or not result.strip():
                  print(name, "error", str(data.get("error", "empty"))[:400])
                  sys.exit(1)
              if name == "overview" and ("### Comprendre le chapitre" not in result or "### L'essentiel" not in result):
                  print("Missing overview sections")
                  sys.exit(1)
              if name == "actions" and ("### Passer à la pratique" not in result or "### Ce qu'il faut retenir" not in result):
                  print("Missing practical sections")
                  sys.exit(1)
          print("All chapter summary smoke tests passed")
          PY
