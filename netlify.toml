# Auralis / LivreVox — déploiement Netlify
# Toutes les clés d'API doivent être configurées dans Netlify (Environment variables, scope Functions).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API handled directly by netlify/functions/api.mts: config.path = '/api/*'.
# No rewrite: the old query-string redirect made /api/health and /api/voices return 404.

# Navigation React : rafraîchir une page garde l'application.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
